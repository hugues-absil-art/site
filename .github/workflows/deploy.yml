name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Contrôle toutes les 4 h : le site n'est reconstruit QUE si le contenu publié dans Sanity a changé
  # (voir le job « check »). Les pages publiées reçoivent ainsi leur page pré-générée et entrent dans le sitemap.
  schedule:
    - cron: '7 */4 * * *'

# Une seule exécution à la fois, sans annuler un déploiement en cours (le contrôle planifié ne doit jamais en interrompre un).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Le contenu a-t-il changé ?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PROJECT: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/site
        run: |
          # Push sur main ou lancement manuel : on reconstruit toujours.
          if [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Déclenchement par $EVENT : reconstruction."
            exit 0
          fi
          TYPES='["resource","exhibition","pressArticle","advice","resourceCategory"]'
          QUERY="string(count(*[_type in $TYPES])) + \"|\" + (*[_type in $TYPES] | order(_updatedAt desc)[0]._updatedAt)"
          CURRENT=$(curl -sf --get "https://${PROJECT}.api.sanity.io/v2024-01-01/data/query/${DATASET:-production}" \
            --data-urlencode "query=${QUERY}" | jq -r '.result // empty' || true)
          # Version publiée du site : domaine personnalisé s'il répond, sinon l'adresse GitHub Pages.
          DEPLOYED=""
          for URL in "https://hugues-absil.com" "$PAGES_URL"; do
            V=$(curl -sf "${URL}/build-info.json" | jq -r '.contentVersion // empty' 2>/dev/null || true)
            if [ -n "$V" ]; then DEPLOYED="$V"; break; fi
          done
          echo "Contenu Sanity : ${CURRENT:-?}"
          echo "Contenu déployé : ${DEPLOYED:-?}"
          if [ -n "$CURRENT" ] && [ "$CURRENT" = "$DEPLOYED" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement : pas de reconstruction."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Changement détecté (ou version inconnue) : reconstruction."
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          # BASCULE DU DOMAINE : site servi à la racine de https://hugues-absil.com (et non plus sous /site/)
          GITHUB_PAGES: 'false'
          VITE_SITE_URL: 'https://hugues-absil.com'
          SEO_STRICT: 'true' # bloque le déploiement si une adresse protégée (seo/protected-urls.json) cesse de répondre
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

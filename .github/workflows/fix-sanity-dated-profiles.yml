name: Fix Sanity dated profiles

# Corrige parent fantôme + editorProfile + slugs expo/stages.
# Nécessite SANITY_API_TOKEN (écriture) + VITE_SANITY_PROJECT_ID / DATASET.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        type: boolean
        default: false
  # Se déclenche aussi au push de ce workflow / script (pour lancer la migration
  # sans droit workflow_dispatch sur le token d’intégration).
  push:
    branches: [main]
    paths:
      - 'scripts/fix-dated-category-profiles.js'
      - '.github/workflows/fix-sanity-dated-profiles.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run profile fix
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/fix-dated-category-profiles.js --dry-run
          else
            node scripts/fix-dated-category-profiles.js
          fi
